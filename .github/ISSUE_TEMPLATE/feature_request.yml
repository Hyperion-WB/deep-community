name: 功能建议
description: 新功能 / 体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新功能请先讨论方向，避免实现完才发现不被接受。请说明使用场景，而不只是「加一个按钮」。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 谁在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 前端
        - 后端
        - 数据库
        - 部署 / 运维
        - 文档
