name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install dependencies (locked)
        run: pip install -r backend/requirements.lock.txt
      - name: Byte-compile
        run: python -m compileall -q backend/app
      - name: Ruff (errors only)
        run: ruff check backend/app --select E9,F63,F7,F82
      - name: Pytest (unit tests)
        working-directory: backend
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-only-test-secret-not-for-production
        run: python -m pytest tests/ -q --disable-warnings

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npm run build
