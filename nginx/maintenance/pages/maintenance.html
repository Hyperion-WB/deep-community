<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="refresh" content="60" />
<title>站点维护中 · DeepCommunity</title>
<style>
  :root{
    --bg:#0b0c0e; --card:#141619; --line:#262a2f; --text:#e8eaed;
    --muted:#9aa0a6; --accent:#f5c451; --ok:#4ade80;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f7; --card:#ffffff; --line:#e3e5e8; --text:#15171a; --muted:#6b7280; --accent:#b4791a; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.65;
    background-image:radial-gradient(1200px 600px at 50% -10%, rgba(245,196,81,.10), transparent 60%);
  }
  .card{
    width:100%; max-width:600px; background:var(--card);
    border:1px solid var(--line); border-radius:20px;
    padding:34px 30px 26px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:600; letter-spacing:.04em;
    color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    padding:5px 11px; border-radius:999px; margin-bottom:18px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  h1{ font-size:26px; line-height:1.3; margin:0 0 10px; letter-spacing:-.01em; }
  p.lead{ margin:0 0 22px; color:var(--muted); font-size:15px; }
  ul{ margin:0 0 22px; padding:0; list-style:none; display:grid; gap:10px; }
  li{ display:flex; gap:10px; font-size:14px; color:var(--text); }
  li .k{ color:var(--ok); flex:0 0 auto; font-weight:700; }
  .meta{
    border-top:1px solid var(--line); padding-top:16px; margin-top:4px;
    display:grid; gap:6px; font-size:13px; color:var(--muted);
  }
  .meta b{ color:var(--text); font-weight:600; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .foot{ margin-top:18px; font-size:12px; color:var(--muted); }
  code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
</style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>临时维护中</span>
    <h1>站点正在维护，稍后回来</h1>
    <p class="lead">
      我们正在进行一次临时的接入调整与服务维护，期间站点会短暂不可用。
      你的账号与数据都完好，无需做任何操作。
    </p>

    <ul>
      <li><span class="k">✓</span> 数据已正常备份，不会丢失</li>
      <li><span class="k">✓</span> 正在切换网络接入与证书，完成后自动恢复</li>
      <li><span class="k">✓</span> 本页每 60 秒自动刷新，恢复后会自动跳回站点</li>
    </ul>

    <div class="meta">
      <div>预计恢复：<b>30 ~ 60 分钟内</b>（视接入生效速度）</div>
      <div>遇到问题请联系：<b>站点管理员</b> / <a href="mailto:admin@example.com">admin@example.com</a></div>
      <div>状态更新：<b>稍后在此页同步</b></div>
    </div>

    <div class="foot">DeepCommunity · 临时维护页 · <code>503</code></div>
  </main>
</body>
</html>
