user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # 对象存储回源缓存：本地磁盘缺失（硬盘故障/误删）时从 R2 取回并落到本地缓存，
    # 既避免每次都回源，也让"本地坏了但图片还能看"这件事真正闭环。
    proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=upload_cache:20m
                     max_size=3g inactive=60d use_temp_path=off;

    # 头像 / 缩略图派生图缓存：同一张头像会被列表页反复请求，
    # 缓存在 nginx 后既省掉后端缩放开销，也避免重复请求挤占接口限流额度。
    proxy_cache_path /var/cache/nginx/avatar levels=1:2 keys_zone=avatar_cache:20m
                     max_size=1g inactive=30d use_temp_path=off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 请求频率限制
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # 全站认证类接口（注册/刷新/找回）统一走较严限流；
    # 移动网络/公司出口常见 NAT 共用 IP，20r/m 会误伤，放宽到 60r/m。
    limit_req_zone $binary_remote_addr zone=auth_all_limit:10m rate=60r/m;
    # 公开搜索接口专用限流：无需登录即可调用，且返回全站标题/用户列表，
    # 若只受 30r/s 的 api_limit 约束，单 IP 每天可抓取上百万条，故单独收紧。
    limit_req_zone $binary_remote_addr zone=public_search:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=user_search:10m rate=30r/m;
    # 头像/缩略图专用桶：一个页面首屏可能同时拉几十张头像，
    # 和普通接口共用 30r/s 的桶必然误伤（表现为头像 429 裂图）。
    limit_req_zone $binary_remote_addr zone=avatar_limit:10m rate=120r/s;
    limit_req_status 429;

    # ===== Cloudflare 真实客户端 IP =====
    # 前面套 Cloudflare 时，$remote_addr 是 CF 边缘节点 IP：
    # 不还原真实 IP 会导致全站共用一个限流桶（20r/m 被打爆）、IP 属地全部错误。
    # 仅在请求确实来自下列 CF 网段时才信任 CF-Connecting-IP，避免被伪造。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # WebSocket 连接协议升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 正式域名：HTTP 仅保留 ACME 校验路径，其余 301 跳转 HTTPS
    server {
        listen 80;
        server_name example.com www.example.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
            default_type text/plain;
        }

        # www 统一收敛到主域名，避免证书 CN 不匹配与重复收录
        location / {
            return 301 https://example.com$request_uri;
        }
    }

    # www 的 HTTPS 入口：证书已含 www，这里统一 301 收敛到主域名
    server {
        listen 443 ssl;
        http2 on;
        server_name www.example.com;
        server_tokens off;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        return 301 https://example.com$request_uri;
    }

    # 主服务块：同时监听 80（IP 直连兜底）与 443（HTTPS）
    server {
        # 显式声明为默认 server：未匹配到 server_name 的请求（含 IP 直连）落到这里
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name localhost _;
        server_tokens off;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 全局安全响应头（含 CSP，统一定义在 security_headers.conf）
        include /etc/nginx/security_headers.conf;

        # 客户端请求体大小上限 (图片上传：动图 GIF 后端放宽到 20MB，这里留出 multipart 余量)
        client_max_body_size 25M;

        # ---------------- 维护模式 ----------------
        # 开关是 /etc/nginx/maintenance/on 这个文件：存在即全站 503 → 展示维护页。
        # if (-f ...) 是逐请求求值的，创建/删除文件立即生效，不需要 reload nginx。
        # 维护页内容由软链 maintenance.html 指向 pages/ 下的具体页面决定。
        error_page 503 /maintenance.html;

        location = /maintenance.html {
            root /etc/nginx/maintenance;
            default_type text/html;
            add_header Cache-Control "no-store, must-revalidate" always;
            include /etc/nginx/security_headers.conf;
        }

        # 容器健康检查专用：维护模式下也必须返回 200，否则容器会被标记 unhealthy
        location = /__health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SEO 动态资源：由后端按当前站点域名与已发布文章实时生成
        location = /robots.txt {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /sitemap.xml {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /rss.xml {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PWA manifest 需要正确的 MIME，否则部分浏览器不识别
        location = /manifest.webmanifest {
            root   /var/www/html;
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=3600";
            include /etc/nginx/security_headers.conf;
        }

        # 前端静态单页应用托管 (index.html 禁止强缓存，确保用户始终秒级获取最新前端发布包)
        location / {
            # 维护模式：直接 503 → error_page 渲染维护页
            if (-f /etc/nginx/maintenance/on) { return 503; }
            root   /var/www/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            include /etc/nginx/security_headers.conf;
        }

        # 带哈希签名的静态资源长期安全缓存
        # 防御性拒绝：这些路径本不该被访问，命中直接 404。
        # 未命中时它们会被 SPA fallback 成 200 + index.html，
        # 既不安全也干扰扫描器与 SEO 判断。
        location ~* /\.(env|git|svn|htaccess|DS_Store) {
            return 404;
        }
        location ~* ^/(backend|frontend|scripts|docs)/ {
            return 404;
        }
        location ~* ^/(docker-compose\.yml|Dockerfile|package-lock\.json|\.env.*)$ {
            return 404;
        }

        location /assets/ {
            root   /var/www/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            include /etc/nginx/security_headers.conf;
        }

        # Docker 嵌入式 DNS 解析器 (保证动态解析 backend，防止启动顺序导致崩溃)
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_upstream "http://backend:8000";

        # 会话自查属于高频正常请求，单独放宽，避免多人共用一个出口 IP 时被误伤
        location = /api/auth/me {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 认证类接口统一限流（注册 / 刷新 / OAuth 回调等）
        location /api/auth/ {
            limit_req zone=auth_all_limit burst=10 nodelay;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 登录更严格：5 次/分钟
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 实时通讯专线 (支持 /api/chat/ws 与 /ws/)
        location ~ ^/(api/chat/ws|ws/) {
            # 维护模式：不接受长连接，让前端退避重试，避免维护期间反复握手
            if (-f /etc/nginx/maintenance/on) { return 503; }
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 社交媒体 OpenGraph 动态卡片预览与直接分享路由 (/p/ 与 /share/)
        location ~ ^/(p/|share/) {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 搜索联想：公开接口 + 全站标题，单独限流防批量抓取
        location = /api/search/suggest {
            limit_req zone=public_search burst=20 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户检索：公开接口 + 返回昵称/简介，限流更严格
        location = /api/users/search {
            limit_req zone=user_search burst=10 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 头像 / 列表缩略图按需缩放：一个页面首屏可能同时拉几十张，
        # 单独限流 + nginx 本地缓存，避免与普通接口共用额度被 429（头像/群头像裂图）
        location = /api/users/avatar {
            limit_req zone=avatar_limit burst=200 nodelay;
            if (-f /etc/nginx/maintenance/on) { return 503; }
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache avatar_cache;
            proxy_cache_key "$host$request_uri";
            proxy_cache_valid 200 30d;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Avatar-Cache $upstream_cache_status;
            include /etc/nginx/security_headers.conf;
        }

        # 后端通用 API 代理
        location /api/ {
            # 首屏会并发十几个接口（会话/未读/勋章/列表），burst 20 太小会被打成 429，
            # 放宽到 60 只吸收瞬时突发，长期速率仍由 30r/s 约束
            limit_req zone=api_limit burst=60 nodelay;
            # 维护模式：API 同样 503，前端会显示统一的维护提示，不会出现半可用状态
            if (-f /etc/nginx/maintenance/on) { return 503; }
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 本地上传图片静态托管 (安全防脚本执行)
        location /uploads/ {
            root /var/www;
            try_files $uri @s3_mirror;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'";
            # 严格禁止在上传目录执行任何脚本
            location ~* \.(php|py|sh|pl|cgi)$ {
                deny all;
            }
        }

        # 对象存储回源：仅当本地文件缺失时命中（Cloudflare R2 自定义域名）
        # 透传上游状态码与响应体，便于定位回源问题
        location @s3_mirror {
            # 回源失败（404/403，或对象存储已下线导致的 5xx）统一返回占位图，
            # 避免历史失效 URL 在前端变成破图或 502 白块
            proxy_intercept_errors on;
            error_page 404 403 500 502 503 504 = /__placeholder.svg;
            # 使用变量 + resolver 延迟解析，避免启动时 DNS 解析失败导致 nginx 退出
            resolver 127.0.0.11 valid=300s ipv6=off;
            set $s3_mirror_upstream https://img.example.com;
            proxy_pass $s3_mirror_upstream;
            proxy_set_header Host img.example.com;
            proxy_ssl_server_name on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        # 回源结果缓存 30 天：同一张图只会真正打一次对象存储
            proxy_cache upload_cache;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-S3-Mirror "1" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Content-Type-Options nosniff always;
        }

        # 本地与对象存储都缺失时的占位图：前端不再出现破图。
        # URI 必须带 .svg：直接用命名 location 时 Content-Type 会退化成请求原后缀（.webp），
        # 浏览器按 webp 解码 SVG 会失败，还是破图。
        location = /__placeholder.svg {
            default_type image/svg+xml;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options nosniff always;
            return 200 '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="14" fill="#e9edf3"/><path d="M18 70l20-23 13 14 11-12 16 21z" fill="#c3cad6"/><circle cx="66" cy="31" r="8" fill="#c3cad6"/></svg>';
        }
    }
}
