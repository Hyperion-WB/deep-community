# 全站安全响应头（通过 include 复用，避免各 location 的 add_header 覆盖继承）
# 注意：任何定义了 add_header 的 location 都不会继承 server 级 add_header，
# 因此 /、/assets/、/uploads/、/manifest 等有缓存头的 location 也要 include 本文件。

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 内容安全策略：脚本仅允许同源与 Cloudflare Turnstile；
# 图片允许任意 https（Markdown 外链图 / 对象存储），样式允许内联（Tailwind + framer-motion）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# HSTS：强制浏览器在 max-age 内仅用 HTTPS 访问本站。
# 注意：HSTS 一旦下发，浏览器会在有效期内强制 HTTPS，无法服务端撤销，
# 因此先启用基础版（不含 includeSubDomains），避免误伤尚未启用 HTTPS 的子域名。
# 确认所有子域名均已全站 HTTPS 后，可升级为：
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Strict-Transport-Security "max-age=31536000" always;
