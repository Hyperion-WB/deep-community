<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070a" />

    <!-- 基础 SEO：标题与描述（搜索结果里显示的两行文字） -->
    <title>深度极客社区 · 记录日常，分享热爱</title>
    <meta name="description" content="一个安静的日常自留地：随手记下的想法、折腾过的代码、读过的书和走过的路。不追热点，不端架子，只留认真生活的碎片。" />
    <link rel="canonical" href="https://example.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph：微信 / QQ / Telegram / Discord 分享时抓取的卡片信息 -->
    <meta property="og:site_name" content="深度极客社区" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="深度极客社区 · 记录日常，分享热爱" />
    <meta property="og:description" content="一个安静的日常自留地：随手记下的想法、折腾过的代码、读过的书和走过的路。不追热点，不端架子，只留认真生活的碎片。" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/logo.png" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter / X 卡片 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="深度极客社区 · 记录日常，分享热爱" />
    <meta name="twitter:description" content="一个安静的日常自留地：随手记下的想法、折腾过的代码、读过的书和走过的路。" />
    <meta name="twitter:image" content="https://example.com/logo.png" />

    <link rel="alternate" type="application/rss+xml" title="深度极客社区 · 最新文章" href="/rss.xml" />

    <!-- 结构化数据：告诉搜索引擎这是一个什么站点（不是可执行脚本，不受 CSP 限制） -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "深度极客社区",
        "alternateName": ["极客社区", "DeepCommunity"],
        "url": "https://example.com/",
        "description": "一个安静的日常自留地：随手记下的想法、折腾过的代码、读过的书和走过的路。不追热点，不端架子，只留认真生活的碎片。",
        "inLanguage": "zh-CN",
        "publisher": {
          "@type": "Organization",
          "name": "深度极客社区",
          "url": "https://example.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://example.com/logo.png"
          }
        }
      }
    </script>

    <!-- 主题初始化必须同步执行且在渲染前完成，避免深浅色闪烁；独立文件以满足严格 CSP -->
    <script src="/theme-init.js"></script>
      <!-- 鸿蒙黑体：按 unicode-range 分片，浏览器只下载页面实际用到的片段 -->
    <!-- 字体 CSS 264KB，改为非阻塞加载：首屏先用系统字体，加载完自动替换 -->
    <link rel="preload" as="style" href="/fonts/harmonyos/Regular.css" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/fonts/harmonyos/Regular.css" /></noscript>
    <link rel="preload" as="style" href="/fonts/harmonyos/Bold.css" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/fonts/harmonyos/Bold.css" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
